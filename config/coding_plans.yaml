    title: Claude pricing (official)
    date: 2026-10
  - url: https://www.growthcab.com/claude-max-usage-limits
    title: 'GrowthCab: Claude Max usage limits'
    date: '2026-10-12'
  models:
  - name: Claude Opus 5.5
    release: claude-opus-5-5
    confidence: measured
  - name: Claude Sonnet 5.5
    release: claude-sonnet-5-5
    basis: Allowance assumed cost-weighted across Claude models (SemiAnalysis measures Sonnet 5.5 within 7% of Opus 5.5 in
