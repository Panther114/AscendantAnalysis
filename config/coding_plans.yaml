    title: 'Classmethod: Kiro credit multipliers vs API price ratios'
    date: 2026-10
  - url: https://www.usagepricing.com/blueprint/kiro
    title: 'UsagePricing: Kiro plans and change history'
    date: 2026-10
  models:
  - name: Claude Opus 5.5
    release: claude-opus-5-5
    multiplier: 8.5
    basis: 2.0x multiplier = 6.2 credits/M tokens; cache-heavy mix $1.16/M (Opus 5.5 $4/$20) / 6.82 credits (x1.1 output weighting)
      = $0.17/credit; /$0.02 = 8.5.
    confidence: derived
  - name: Claude Sonnet 5.5
    release: claude-sonnet-5-5
    multiplier: 6.5
    basis: 1.3x = 4.03 credits/M; mix $0.58/M (Sonnet 5.5 $2/$10) / 4.43 credits = $0.131/credit; /$0.02 = 6.5.
    confidence: derived
  - name: GPT-5.6 Terra
    release: gpt-5-6-terra
    multiplier: 4.2
    basis: 2.2x = 6.82 credits/M; mix $0.63/M (Terra $2/$12) / 7.5 credits = $0.084/credit; /$0.02 = 4.2. Burn multiplier
      extrapolated, not measured; excludes >272K requests (double rate).
    confidence: estimate
  - name: Kimi K3
    release: kimi-k3
    multiplier: 5.3
    basis: 2.4x = 7.44 credits/M; mix $0.87/M (K3 $3/$15) / 8.18 credits = $0.106/credit; /$0.02 = 5.3. Extrapolated, not
      measured.
    confidence: estimate
  - name: Qwen3 Coder Next
    release: qwen3-coder-next
    multiplier: 18.0
    basis: 'Kiro bills at least 0.01 credit per request; a ~50k-token cache-heavy call at 0.05× would cost ~0.008 credit,
      so the floor binds: $0.0037 of list-price tokens per $0.0002 credit = ×18.'
    confidence: estimate
