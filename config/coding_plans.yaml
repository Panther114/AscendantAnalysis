- id: kiro-pro
  provider: Amazon
  product: Kiro
  plan: Pro
  region: global
  price_usd: 20
  price_local: $20/month
  billing: $20/month; first paid upgrade from Free includes a $20 credit
  quota: 1,000 credits/month (no rollover; $0.02 per included credit). Add-on credits $0.04 each (packs $5-$100, expire after
    12 months). Credit burn = task credits on Auto x per-model multiplier (Opus 5.5 2.0x, Sonnet 5.5 1.3x, GPT-5.6 Terra 2.2x,
    Kimi K3 2.4x, Qwen3 Coder Next 0.05x, Auto 1.0x).
  tools:
  - Kiro IDE
  - Kiro CLI
  verified: '2026-10-20'
  confidence: derived
  default_multiplier: 6.5
  default_basis: 'One API-$-per-credit value per model, identical on every tier (all tiers = $0.02/included credit, so same
    multiplier). Classmethod metered single-request runs in Kiro CLI: Sonnet 5 0.82/1.80/2.10 credits for 189K/435K/506K input
    tokens (3.98 credits/M slope, ~0.07 fixed); Opus 5 1.40/3.07/3.57 for 190K/435K/506K (6.9/M); Auto 0.61/1.39/1.61 for
    188K/434K/505K (3.2/M). So credits are ~linear in tokens at ~3.1 credits/M tokens per 1.0x. Value per credit = brief cache-heavy
    mix $/M (90% cache read at 10% of input, 7.5% fresh, 2.5% output) / (3.1 x multiplier x 1.1 [output weighting]). Sonnet
    5.5: $0.58/M / 4.43 = $0.131/credit = 6.5x the $0.02 included rate. Default shown = Sonnet 5.5; Opus 5.5 8.5x.'
  caveats: Kiro bills per request/credit not per token and publishes no token or dollar conversion; the 3.1 credits/M slope
    comes from one third-party test with uncached first-call inputs, assumes cache reads count as full tokens (conservative;
    if Kiro discounts cache, value is higher), and the 1.1 output weighting is assumed. Uncertainty roughly +-40%. Previous
    x2.0 (add-on $0.04 vs $0.02) was wrong because $0.04 is a retail overage price, not API cost; uncached list cost per credit
    measured at ~$0.50-0.70. Fable 5.1 is Enterprise-preview only and excluded. Amazon Q Developer Pro closed.
  sources:
  - url: https://kiro.dev/pricing/
    title: Kiro pricing (official)
    date: 2026-10
  - url: https://kiro.dev/docs/cli/chat/model-selection/
    title: Kiro model credit multipliers (official)
    date: 2026-10
  - url: https://kiro.dev/docs/billing/related-questions/
    title: Kiro billing FAQ (official; per-request not per-token, no $ per credit)
    date: 2026-10
