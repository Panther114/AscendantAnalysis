- id: kwaikat-coding-plan-mini-china
  provider: Kuaishou
  product: KwaiKAT Coding Plan
  plan: Mini (China, CNY)
  region: china
  price_usd: 4.08
  price_local: ¥29/month
  billing: Monthly; first-month discounts not counted
  quota: 40 prompts per 5-hour window (1 prompt ≈ 15-20 model calls per the vendor). No weekly or monthly cap published.
  tools:
  - Claude Code
  - mainstream IDEs and CLIs (no third-party backends, scripts or account sharing)
  verified: '2026-10-20'
  confidence: estimate
  default_multiplier: 55.1
  default_basis: 'Assumption: a heavy-but-realistic user fully burns one 5-hour window every other day (15 windows/month;
    no community window-count data found). 40 prompts × 15 = 600 prompts × 15 calls × 45,000 tokens = 0.41B tokens × $0.250/M
    (KAT-Coder-Pro V2.5: ¥5 in / ¥20 out / ¥1 cache read per 1M) = $101 ÷ $4.08 = x24.8. Rescaled ×2.22 to the common 100k
    tokens per model call used for every request-counted plan (Volcengine Ark: ~60k/call over 5,000 calls; Claude Code logs:
    ~190k/call; committed 100k).'
  caveats: No weekly cap is published, so the value depends entirely on how many windows are burned (15 windows/month assumed;
    double it for a window every day, halve it for one every four days). The higher tiers need many parallel agents to saturate;
    a single human rarely sends 1,000 prompts in 5 hours. Only KAT-Coder-Pro (V1, V2, V2.5) is covered, which is not an AA-tracked
    model. Mini is below the $10 threshold.
