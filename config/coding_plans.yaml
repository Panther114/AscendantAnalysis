# Coding-plan subsidies for the Cost & Plans chart. Hand-reviewed: NEVER updated automatically.
# Every plan cites dated sources; `ascendant plans-check` (daily in CI) compares Devforth's
# crowd-measured limits against `devforth_baseline` (the value Devforth showed at review time),
# probes every source URL and flags entries older than `stale_after_days`. Flags need a person.
# multiplier: per model; falls back to the plan's default_multiplier. release: AA release slug
# (null = not a model AA tracks). confidence: official | measured | derived | estimate | unknown.
version: 1
reviewed: '2026-10-18'
min_price_usd: 10
stale_after_days: 90
fx:
  CNY: 7.1
definition: Subsidy = API-equivalent value of the plan's monthly allowance for a model ÷ the plan's monthly price. Cost through
  a plan = API cost per task ÷ the best eligible plan's subsidy for that model.
plans:
- id: anthropic-claude-pro
  provider: Anthropic
  product: Claude Code
  plan: Pro
  region: global
  price_usd: 20
  billing: $20/month, or $17/month billed annually
  quota: 5-hour session window plus a weekly limit, shared with Claude chat. Anthropic publishes no dollar or token quota.
    Claude Fable models are not in the Pro allowance (paid usage credits only).
  tools:
  - Claude Code
  - Claude apps
  verified: '2026-10-18'
  confidence: measured
  devforth: anthropic-claude-pro
  devforth_baseline: 60.9
  default_multiplier: 58.9
  default_basis: 'SemiAnalysis metered the weekly limit on Opus 5.5 with an agentic, cache-heavy token mix: $1,178/month API-equivalent
    ÷ $20 = ×58.9. The weekly window binds. Devforth''s crowd measurement ($280/week ≈ $1,217/month, ×60.9) agrees within
    3%.'
  caveats: Independent real-traffic data (Wokey, 559 accounts) is ~40% lower ($170/week, ×36.5); the chart uses the controlled
    saturation test because the subsidy is defined at the full allowance.
  sources:
  - url: https://www.orcarouter.ai/blog/claude-opus-5-5-vs-gpt-6-1-sol-subscription-value
