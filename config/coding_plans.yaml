# Coding-plan subsidies for the Cost & Plans chart. Hand-reviewed: NEVER updated automatically.
# Every plan cites dated sources; `ascendant plans-check` (daily in CI) compares Devforth's
# crowd-measured limits against `devforth_baseline` (the value Devforth showed at review time),
# probes every source URL and flags entries older than `stale_after_days`. Flags need a person.
# multiplier: per model; falls back to the plan's default_multiplier. release: AA release slug
# (null = not a model AA tracks). confidence: official | measured | derived | estimate. Every model has one committed
# number (no ranges or blanks); tiers the provider scales linearly with price share one multiplier. exclude_reason keeps a
# plan in the catalog but out of the best-plan pick (closed to new subscribers, sold out).
version: 1
reviewed: '2026-10-20'
min_price_usd: 10
stale_after_days: 90
fx:
  CNY: 7.1
definition: Subsidy = API-equivalent value of the plan's monthly allowance for a model ÷ the plan's monthly price. Cost through
  a plan = API cost per task ÷ the best eligible plan's subsidy for that model.
plans:
- id: github-copilot-pro
  provider: GitHub
  product: GitHub Copilot
  plan: Pro
  region: global
  price_usd: 10
  billing: $10/month
  quota: 1,500 AI credits a month (1 credit = $0.01; base credits equal the price, the rest is a variable flex allotment).
    Models bill at API list price; completions unlimited.
  tools:
  - VS Code
  - JetBrains
  - Copilot CLI
  - Copilot coding agent
  verified: '2026-10-18'
  confidence: official
