# Ascendant Analysis Health Index, Methodology v1.
# Every constant that influences a score lives here. Changing any value requires
# bumping `version`, and the full history is recomputed.
version: "1.2.0"

field:
  shelf_life_days: 365        # a release with no successor in its product line drops out after this
  min_intelligence: 1.0       # releases whose best variant scores below this are ignored

cost:
  # log C = w_task * log(cost_per_task) + w_price * log(blended_price_3to1)
  w_task: 0.5
  w_price: 0.5

tiers:
  # Jenks natural breaks on log blended price of active releases. The cheap end of the
  # market has a long open-weights tail, so we cut finely (k=5) and map the top band to
  # frontier, the next to mid, and the remaining bands to small.
  jenks_k: 5
  frontier_bands: 1
  mid_bands: 1
  # A lab's most intelligent active line is promoted mid -> frontier when it lands within
  # this many index points of the field's best model (it is genuinely a flagship).
  flagship_promotion_gap: 12

leadership:
  tau_intelligence: 3.0       # index points (wider than AA's run-to-run noise)
  tau_log_cost: 0.35          # natural-log units (~1.42x)
  tau_speed: 0.25             # natural-log units (~1.28x)
  # Frontier ownership: at every capability level L (field max intelligence minus g, g on a
  # 1-point grid) the lab's lead is sigmoid(log(cheapest rival cost reaching L / cheapest own
  # cost reaching L) / tau). Unreachable levels count 0; levels no rival reaches count 1.
  # Zones are anchored to the frontier, so only relevant models contest cost.
  efficiency_zone: [0, 12]         # near-frontier: cheapest way to get top capability
  value_zone: [13, 25]             # good-enough: cheapest way to get solid capability
  level_step: 1.0
  speed_gap: 20                    # fastest model within this many points of the frontier
  speed_weight: 0.5
  max_weight: 0.6             # FL = max_w * max(leads) + (1 - max_w) * weighted_mean(leads)

lineup:
  w_intelligence: 0.5
  w_value: 0.4
  w_speed: 0.1
  # LS = mw * best tier + (1 - mw) * mean over all tiers (missing tier = 0): a specialist
  # that wins its tier scores well, a full lineup earns the breadth bonus.
  max_weight: 0.5

core:
  max_weight: 0.55            # Core = mw * max(FL, LS) + (1 - mw) * mean(FL, LS)

momentum:
  # Trend = recency-weighted mean change in at-release competitiveness between each
  # material release and its predecessor in the same product line.
  window: 5                   # last N successor deltas
  recency_half_life_days: 180
  tau_trend: 0.08             # competitiveness units
  floor: 0.80
  span: 0.40                  # M = floor + span * m

freshness:
  grace_days: 30
  half_life_days: 60
  floor: 0.6                  # applied as floor + (1 - floor) * phi
  material_frontier_gap: 3.0  # within N index points of the tier leader at release

lab_scope:
  min_releases: 2
  active_window_days: 365
  # Rank only labs with at least one active, priced model. Unpriced labs still count as
  # rivals (their models shape the field) but can't be tiered or compared on cost.
  require_priced_release: true

bands:
  - [80, Ascendant]
  - [65, Contending]
  - [50, Holding]
  - [35, Slipping]
  - [0, Fading]

replay:
  # First day replayed. Before 2025 many deprecated models have no price or speed in
  # AA's current data, so tiers and cost leads aren't reliable.
  start: "2025-01-06"
  step_days: 1
