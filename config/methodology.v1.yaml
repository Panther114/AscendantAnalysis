# Ascendant Analysis Health Index, Methodology v1.
# Every constant that influences a score lives here. Changing any value requires
# bumping `version`, and the full history is recomputed.
version: "1.8.1"

index:
  # Major version of the Artificial Analysis Intelligence Index every score is taken from. AA
  # rescores models on each major version (v4 -> v5 moved scores by -16 to +4 points and cost per
  # task by up to 2x), so versions are never mixed: a snapshot on another version is rejected,
  # and a model's own older-version score is never used as if it were current.
  version: "5"
  # A model AA has not rescored gets an *estimated* score (flagged, shown with *) mapped from its
  # last score on the previous version: a quadratic fit on the models scored on both, plus a lab
  # offset shrunk by n / (n + lab_shrinkage). Leave-one-out error is about 3 index points, the
  # size of tau_intelligence. Estimated models have no measured cost per task (it is imputed).
  # `snapshot` is the last snapshot taken before AA switched versions.
  bridge:
    snapshot: "2026-10-27"
    lab_shrinkage: 2.0

field:
  shelf_life_days: 365        # a release with no successor in its product line drops out after this
  min_intelligence: 1.0       # releases whose best variant scores below this are ignored
  # A newer release replaces the active one in its product line only if it is no more than
  # this many index points weaker. A much weaker sibling (a ChatGPT, vision or instruct cut
  # of a flagship) joins the field next to it instead of hiding it.
  supersede_gap: 3.0

cost:
  # log C = w_task * log(cost_per_task) + w_price * log(blended_price_3to1)
  w_task: 0.5
  w_price: 0.5

tiers:
  # A release's tier is a function of its own blended price (USD per 1M tokens, 3:1) and
  # nothing else, so no other model can move it. Frontier is flagship pricing (Opus, Fable,
  # GPT/Gemini top models), mid is the workhorse band (Sonnet, Flash, Sol), small is below.
  frontier_min_price: 7.0
  mid_min_price: 1.0
  # AA drops the price of deprecated models, which would strip them of a tier for the whole
  # replay. A deprecated release with no price takes the blended price of the nearest priced
  # release in its product line (earlier first, then later). Never-priced models stay untiered.
  impute_deprecated_price: true

leadership:
  tau_intelligence: 3.0       # index points (wider than AA's run-to-run noise)
  tau_log_cost: 0.35          # natural-log units (~1.42x)
  tau_speed: 0.25             # natural-log units (~1.28x)
  # Frontier ownership: at every capability level L (field max intelligence minus g, g on a
  # 1-point grid) the lab's lead is sigmoid(log(cheapest rival cost reaching L / cheapest own
  # cost reaching L) / tau). Unreachable levels count 0; levels no rival reaches count 1.
  # Zones are anchored to the frontier, so only relevant models contest cost.
  efficiency_zone: [0, 12]         # near-frontier: cheapest way to get top capability
  value_zone: [13, 25]             # good-enough: cheapest way to get solid capability
  level_step: 1.0
  speed_gap: 20                    # fastest model within this many points of the frontier
  speed_weight: 0.5
  max_weight: 0.6             # FL = max_w * max(leads) + (1 - max_w) * weighted_mean(leads)

lineup:
  w_intelligence: 0.5
  w_value: 0.4
  w_speed: 0.1
  # Each axis is a soft win rate: the mean over rival labs in the tier of
  # sigmoid((own - rival) / tau). With many entrants it tracks the percentile rank; with two
  # or three it stays graded by the size of the gap instead of jumping between 0 and 1.
  tau_intelligence: 3.0       # index points
  tau_value: 3.0              # index points of value residual
  tau_speed: 0.25             # log units of speed residual
  # LS = mw * best tier + (1 - mw) * mean over all tiers (missing tier = 0): a specialist
  # that wins its tier scores well, a full lineup earns the breadth bonus.
  max_weight: 0.5

core:
  max_weight: 0.55            # Core = mw * max(FL, LS) + (1 - mw) * mean(FL, LS)

momentum:
  # Trend = recency-weighted mean change in at-release competitiveness between each
  # material release and its predecessor in the same product line.
  window: 5                   # last N successor deltas
  recency_half_life_days: 120
  tau_trend: 0.05             # competitiveness units
  floor: 0.75
  span: 0.50                  # M = floor + span * m

freshness:
  grace_days: 21
  half_life_days: 45
  floor: 0.5                  # applied as floor + (1 - floor) * phi
  material_frontier_gap: 3.0  # within N index points of the tier leader at release

lab_scope:
  # One release is enough: the Intelligence Index v5 rescore left most labs with a single
  # scored release, and a lab's current flagship is a fair basis for a rank.
  min_releases: 1
  active_window_days: 365
  # Rank only labs with at least one active, priced model. Unpriced labs still count as
  # rivals (their models shape the field) but can't be tiered or compared on cost.
  require_priced_release: true

bands:
  - [80, Ascendant]
  - [65, Contending]
  - [50, Competitive]
  - [35, Trailing]
  - [0, Peripheral]

replay:
  # First day replayed. Before 2025 many deprecated models have no price or speed in
  # AA's current data, so tiers and cost leads aren't reliable.
  start: "2025-01-06"
  step_days: 1
