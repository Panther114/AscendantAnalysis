  # Argon's successor, not a separate product, so the name heuristic must not split them.
  gemini-4-argon: Gemini Frontier
  gemini-4-carbon: Gemini Frontier

# release slug -> tier (small | mid | frontier)
tiers: {}

# release slugs excluded from scoring (e.g. duplicates, routers, non-models)
exclude_releases: []
