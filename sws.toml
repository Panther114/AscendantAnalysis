# static-web-server config (copied into the Railway image).
# Hashed build assets keep the built-in 1-year cache. HTML, data JSON and page payloads
# must revalidate (cheap 304s), otherwise visitors could keep stale HTML that points at
# JS chunks a newer deploy no longer has.
[general]

[advanced]

[[advanced.headers]]
source = "**/*.{html,json,txt}"
headers = { Cache-Control = "no-cache" }
